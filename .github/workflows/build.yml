# Builds the plugin, runs the test suite, and checks binary compatibility against every
# IDE the JetBrains Marketplace considers compatible with our declared build range.
# On pushes to main it also refreshes the draft GitHub release that release.yml acts on.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: ./intellij-adapter/build/distributions/*.zip

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Covers the core unit tests, the ArchUnit rule that keeps com.intellij.* out of
      # core, and the IntelliJ platform tests for marker presence, absence and staleness.
      - name: Run tests
        run: ./gradlew check

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            intellij-adapter/build/reports/tests

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      # The Plugin Verifier downloads whole IDE distributions.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # This is what keeps the open-ended untilBuild honest: if a future IDE breaks an
      # API we use, this job fails before anyone installs a broken build.
      - name: Verify plugin structure and binary compatibility
        run: ./gradlew verifyPlugin

      - name: Upload Plugin Verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: ./intellij-adapter/build/reports/pluginVerifier

  release-draft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Remove previous drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')"
          NOTES=./build/tmp/release_note.txt
          mkdir -p "$(dirname "$NOTES")"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$NOTES"
          gh release create "v$VERSION" --draft --title "v$VERSION" --notes-file "$NOTES"
