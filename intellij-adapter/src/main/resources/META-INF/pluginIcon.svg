<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- The process boundary: code on the left, the outside world on the right. -->
  <rect x="4" y="5" width="11" height="30" rx="2.5" fill="#C9CCD6"/>
  <g fill="#8C8F99">
    <rect x="6.5" y="10" width="6" height="2" rx="1"/>
    <rect x="6.5" y="15" width="6" height="2" rx="1"/>
    <rect x="6.5" y="20" width="6" height="2" rx="1"/>
    <rect x="6.5" y="25" width="6" height="2" rx="1"/>
  </g>
  <!-- Leaving the process: the call that crosses the boundary. -->
  <path fill="#834DF0" d="M17 17.6h11.5v-4.4L36 20l-7.5 6.8v-4.4H17v-4.8z"/>
</svg>
